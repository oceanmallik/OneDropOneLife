name: Hourly Donor Data Update

on:
  schedule:
    # Triggers at the start of every hour (e.g., 1:00, 2:00, 3:00 UTC)
    - cron: '0 * * * *'
  # Allows you to manually trigger the sync using a button on GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Execute fetch script
      run: python fetch_donors.py

    - name: Commit and push changes if data changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add donors.json
        # The script will only commit if the information in Google Sheets actually changed
        git diff-index --quiet HEAD || (git commit -m "Automated update: Donor database synced" && git push)